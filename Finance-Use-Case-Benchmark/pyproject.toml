[project]
name = "usecase-bench-finance"
version = "0.1.0"
description = "Reproducible benchmark of web research agents on finance use cases, judged against pooled web-verified truth"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["evaluation", "benchmark", "web-research", "agents", "finance"]

dependencies = [
  "nimble-python>=1.2",
  "httpx>=0.27",
  "certifi>=2024.2.2",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usecase_bench"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
